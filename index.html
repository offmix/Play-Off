<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Off!</title>
  <meta name="description" content="ブラウザで遊べるゲームポータル">
  <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="topbar">
    <div class="topbar-container">
      <a href="/" class="brand">
        <img src="image/favicon.svg" alt="" class="brand-icon">
        <span>Play Off!</span>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="ゲームを検索..." aria-label="ゲーム検索">
      </div>
    </div>
  </nav>

  <div class="main-wrapper">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h2 class="sidebar-title">カテゴリ</h2>
        <div class="category-buttons">
          <button class="category-btn active" data-genre="all" type="button">
            <svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
            <span>すべて</span>
          </button>
          <button class="category-btn" data-genre="action" type="button">
            <svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m13 2-9 12h7l-1 8 10-13h-7z" /></svg>
            <span>アクション</span>
          </button>
          <button class="category-btn" data-genre="racing" type="button">
            <svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 21V4m0 1h13l-3 4 3 4H5" /></svg>
            <span>レーシング</span>
          </button>
          <button class="category-btn" data-genre="casual" type="button">
            <svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 10h12a4 4 0 0 1 3.7 5.5l-.9 2.1a2 2 0 0 1-3.2.7L15 15H9l-2.6 3.3a2 2 0 0 1-3.2-.7l-.9-2.1A4 4 0 0 1 6 10Z" /><path d="M7 12v4m-2-2h4m8-1h.01M18 15h.01" /></svg>
            <span>カジュアル</span>
          </button>
          <button class="category-btn" data-genre="iogame" type="button">
            <svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6" cy="6" r="2" /><circle cx="18" cy="7" r="2" /><circle cx="12" cy="18" r="2" /><path d="m7.5 7.2 3.4 8.2m5.5-7.9-3.5 7.7m-4.9-8 7.9-.1" /></svg>
            <span>ioゲーム</span>
          </button>
          <button class="category-btn" data-genre="horror" type="button">
            <svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a8 8 0 0 0-8 8v3a3 3 0 0 0 3 3h1v3h8v-3h1a3 3 0 0 0 3-3v-3a8 8 0 0 0-8-8Z" /><path d="M9 11v2m6-2v2m-5 4h4" /></svg>
            <span>ホラー</span>
          </button>
          <button class="category-btn" data-genre="sport" type="button">
            <svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z" /><path d="M8 6H5v2a4 4 0 0 0 4 4m7-6h3v2a4 4 0 0 1-4 4m-3 0v4m-4 0h8l1 4H8l1-4Z" /></svg>
            <span>スポーツ</span>
          </button>
          <button class="category-btn" data-genre="simulator" type="button">
            <svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" /><path d="M8 4v4m8 2v4m-5 2v4" /></svg>
            <span>シミュレーター</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="hero">
        <div class="hero-content">
          <p class="hero-eyebrow">お知らせ</p>
          <h1 class="hero-title">新しいゲームを追加しました！</h1>
          <p class="hero-desc">さっそく遊んじゃう？</p>
        </div>
      </div>

      <div id="allGamesContainer"></div>

      <div class="no-results" id="noResults" style="display:none;">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
          <circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M21 32h22M32 21v22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <h2>検索結果が見つかりません</h2>
        <p>別のキーワードで試してみてください</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
