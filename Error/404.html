<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="お探しのページは見つかりません。"
    />
    <title>404 — ページが見つかりません</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23173c38'/%3E%3Cpath d='M20 4v15H5L18 4m5 0v24' fill='none' stroke='%23f2f2e9' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --paper: #141819;
        --ink: #eef1eb;
        --muted: #a8b1ad;
        --line: #343c3a;
        --accent: #9fc2b3;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        background: var(--paper);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "Zen Kaku Gothic New", sans-serif;
      }

      .page {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        overflow: hidden;
        padding: clamp(24px, 4.2vw, 58px) clamp(24px, 7vw, 104px) 30px;
      }

      .page::before {
        position: absolute;
        z-index: -1;
        top: 0;
        right: clamp(24px, 7vw, 104px);
        bottom: 0;
        width: 1px;
        background: rgb(23 60 56 / 5%);
        content: "";
      }

      .header,
      .footer {
        display: flex;
        width: min(100%, 1240px);
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
      }

      .header {
        min-height: 36px;
      }

      .signature,
      .status,
      .footer-label {
        margin: 0;
        font-family: "Ubuntu", sans-serif;
        font-size: 11px;
        font-weight: 300;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .signature {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        width: 8px;
        height: 8px;
        background: var(--accent);
      }

      .status {
        color: var(--muted);
      }

      .content {
        display: grid;
        width: min(100%, 1120px);
        flex: 1;
        grid-template-columns: minmax(0, 1.08fr) minmax(340px, 0.92fr);
        align-items: center;
        gap: clamp(54px, 9vw, 142px);
        margin: 0 auto;
        padding: 60px 0 72px;
      }

      .visual {
        position: relative;
        padding: 4px 0 20px;
      }

      .visual-label {
        margin: 0 0 24px 8px;
        color: var(--muted);
        font-family: "Ubuntu", sans-serif;
        font-size: 11px;
        font-weight: 300;
        letter-spacing: 0.19em;
      }

      .number {
        margin: 0 0 0 -12px;
        color: var(--ink);
        font-family: "Orbitron", sans-serif;
        font-size: clamp(132px, 20vw, 258px);
        font-weight: 500;
        line-height: 0.92;
        letter-spacing: -0.095em;
        font-variant-numeric: tabular-nums;
      }

      .route {
        display: block;
        width: min(76%, 360px);
        height: 42px;
        margin: 26px 0 0 8px;
        overflow: visible;
      }

      .message {
        display: flex;
        min-height: 294px;
        flex-direction: column;
        justify-content: center;
        padding: 4px 0 4px clamp(32px, 5vw, 72px);
        border-left: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--accent);
        font-family: "Ubuntu", sans-serif;
        font-size: 11px;
        font-weight: 300;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 440px;
        margin: 0 0 18px;
        font-size: clamp(24px, 2.6vw, 32px);
        font-weight: 700;
        letter-spacing: 0.015em;
        line-height: 1.55;
      }

      .description {
        max-width: 400px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 400;
        line-height: 2;
        letter-spacing: 0.02em;
      }

      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 28px;
        margin-top: 34px;
      }

      .home {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
        padding: 0 16px 0 18px;
        border: 1px solid var(--ink);
        color: var(--paper);
        background: var(--ink);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.035em;
        transition: color 160ms ease, background-color 160ms ease;
      }

      .home:hover {
        color: var(--ink);
        background: transparent;
      }

      .home svg,
      .back svg {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-width: 1.5;
      }

      .back {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        gap: 9px;
        padding: 0;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        background: transparent;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: border-color 160ms ease;
      }

      .back:hover {
        border-color: var(--ink);
      }

      .home:focus-visible,
      .back:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .footer {
        padding-top: 19px;
        border-top: 1px solid var(--line);
      }

      .footer-label {
        color: var(--muted);
        font-size: 10px;
      }

      .footer-note {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.02em;
      }

      @media (max-width: 760px) {
        .page {
          padding: 24px 24px 22px;
        }

        .page::before {
          right: 24px;
        }

        .content {
          grid-template-columns: 1fr;
          gap: 34px;
          align-content: center;
          padding: clamp(48px, 10vh, 88px) 0;
        }

        .visual {
          padding: 0;
        }

        .visual-label {
          margin: 0 0 17px 4px;
        }

        .number {
          margin-left: -7px;
          font-size: clamp(130px, 34vw, 210px);
        }

        .route {
          width: min(70%, 280px);
          margin: 14px 0 0 4px;
        }

        .message {
          min-height: auto;
          padding: 0;
          border-left: 0;
        }

        h1 {
          max-width: 500px;
          margin-bottom: 12px;
          font-size: 25px;
        }

        .description {
          font-size: 13px;
        }

        .actions {
          gap: 18px;
          margin-top: 25px;
        }
      }

      @media (max-width: 430px) {
        .status {
          font-size: 9px;
        }

        .actions {
          align-items: flex-start;
          flex-direction: column;
          gap: 9px;
        }

        .home {
          width: min(100%, 260px);
        }

        .footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .home,
        .back {
          transition: none;
        }
      }

      .page {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .page::before {
        display: none;
      }

      .minimal {
        width: 100%;
        text-align: center;
      }

      .minimal-error {
        margin: 0 0 16px;
        color: var(--accent);
        font-family: "Ubuntu", sans-serif;
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.12em;
      }

      .minimal-number {
        margin: 0;
        color: var(--ink);
        font-family: "Orbitron", sans-serif;
        font-size: clamp(132px, 24vw, 248px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.09em;
        font-variant-numeric: tabular-nums;
      }

      .minimal-title {
        margin: 20px 0 0;
        color: var(--muted);
        font-size: clamp(16px, 1.8vw, 20px);
        font-weight: 400;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="minimal" aria-labelledby="page-title">
        <p class="minimal-error">Error</p>
        <p class="minimal-number" aria-label="404">404</p>
        <h1 class="minimal-title" id="page-title">お探しのページは見つかりません。</h1>
      </section>
    </main>
  </body>
</html>
