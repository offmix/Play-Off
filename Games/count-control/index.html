<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Count Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens (Supabase) ───────────────────────── */
    :root {
      --bg-page:        #171717;
      --bg-btn:         #0f0f0f;
      --bg-surface:     rgba(41,41,41,0.84);
      --text-primary:   #fafafa;
      --text-secondary: #b4b4b4;
      --text-muted:     #898989;
      --green:          #3ecf8e;
      --green-link:     #00c573;
      --green-border:   rgba(62,207,142,0.3);
      --border-subtle:  #242424;
      --border-std:     #2e2e2e;
      --border-prom:    #363636;
    }

    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }

    /* ── UI layer ───────────────────────────────────────── */
    #ui {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ── Top HUD ────────────────────────────────────────── */
    #top-hud {
      position: absolute; top: 0; left: 0; width: 100%;
      padding: 12px 16px 0;
      display: flex; flex-direction: column; align-items: center;
    }

    #progress-row {
      display: flex; align-items: center;
      width: 100%; max-width: 300px; gap: 8px;
    }
    #progress-runner { font-size: 15px; }
    #progress-bar-wrap {
      flex: 1; height: 4px;
      background: var(--border-std);
      border-radius: 9999px; overflow: hidden;
    }
    #progress-bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 9999px;
      transition: width 0.3s ease;
      width: 0%;
    }
    #progress-flag { font-size: 15px; }

    #level-label {
      font-family: 'Source Code Pro', monospace;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* ── Coin display ───────────────────────────────────── */
    #coin-display {
      position: absolute; top: 12px; right: 14px;
      background: var(--bg-btn);
      border: 1px solid var(--border-std);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 9999px;
      display: flex; align-items: center; gap: 6px;
    }
    #coin-display::before { content: '🪙'; font-size: 12px; }

    #count-display { display: none; }

    /* ── Shared overlay ─────────────────────────────────── */
    #start-screen,
    #level-complete,
    #game-over {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: auto;
    }

    /* ── Start screen ───────────────────────────────────── */
    #start-screen {
      background: linear-gradient(
        to bottom,
        rgba(23,23,23,0.72) 0%,
        rgba(23,23,23,0.28) 55%,
        transparent 100%
      );
    }
    #start-screen h1 {
      font-size: 38px;
      font-weight: 400;
      line-height: 1.00;
      color: var(--text-primary);
      text-align: center;
      letter-spacing: -0.16px;
    }
    /* 무지개 색상 제거 — 모두 흰색 */
    #start-screen h1 span { color: var(--text-primary); }

    /* 초록 언더라인 액센트 */
    #start-screen h1 span:nth-child(2) {
      border-bottom: 2px solid var(--green-border);
      padding-bottom: 1px;
    }

    #start-screen .tap-hint {
      margin-top: 36px;
      font-family: 'Source Code Pro', monospace;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

    /* ── Level complete ─────────────────────────────────── */
    #level-complete {
      display: none;
      background: rgba(23,23,23,0.88);
      backdrop-filter: blur(16px);
      gap: 0;
    }
    #level-complete h2 {
      font-family: 'Source Code Pro', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 12px;
    }
    #level-complete .score {
      font-size: 52px;
      font-weight: 400;
      line-height: 1.00;
      color: var(--text-primary);
      margin-bottom: 28px;
    }
    #level-complete button {
      pointer-events: auto;
      background: var(--bg-btn);
      color: var(--text-primary);
      border: 1px solid var(--text-primary);
      padding: 9px 32px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #level-complete button:hover {
      border-color: var(--green);
      color: var(--green);
    }

    /* ── Game over ──────────────────────────────────────── */
    #game-over {
      display: none;
      background: rgba(23,23,23,0.90);
      backdrop-filter: blur(16px);
      gap: 0;
    }
    #game-over h2 {
      font-family: 'Source Code Pro', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    #game-over .go-stats {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; margin-bottom: 28px;
    }
    #game-over .go-level {
      font-family: 'Source Code Pro', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    #game-over .go-stat {
      display: flex; align-items: center; gap: 8px;
    }
    #game-over .go-stat .go-icon { font-size: 15px; }
    #game-over .go-stat .go-val {
      font-size: 40px;
      font-weight: 400;
      line-height: 1.00;
      color: var(--text-primary);
    }
    #game-over .go-stat span:not(.go-icon):not(.go-val) {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
    }
    #game-over .go-buttons {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    #game-over .ad-revive-info {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.5;
      margin-bottom: 4px;
    }
    #game-over .ad-revive-info .revive-count {
      font-size: 22px;
      font-weight: 500;
      color: var(--green);
    }
    #game-over .btn-ad {
      pointer-events: auto;
      background: var(--bg-btn);
      color: var(--text-primary);
      border: 1px solid var(--text-primary);
      padding: 9px 32px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: border-color 0.15s, color 0.15s;
    }
    #game-over .btn-ad:hover {
      border-color: var(--green);
      color: var(--green);
    }
    #game-over .btn-ad .ad-icon { font-size: 15px; }
    #game-over .btn-restart {
      pointer-events: auto;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-std);
      padding: 8px 28px;
      font-size: 13px;
      font-weight: 400;
      border-radius: 9999px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #game-over .btn-restart:hover {
      border-color: var(--border-prom);
      color: var(--text-secondary);
    }

    /* ── Control hint ───────────────────────────────────── */
    #control-hint {
      position: absolute; left: 16px; bottom: 80px;
      background: rgba(23,23,23,0.92);
      border: 1px solid var(--border-std);
      border-radius: 8px;
      padding: 14px 18px;
      display: none; flex-direction: column;
      align-items: center; gap: 8px;
      backdrop-filter: blur(12px);
      transition: opacity 0.6s;
    }
    #control-hint .hint-title {
      font-family: 'Source Code Pro', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    #control-hint .hint-row { display: flex; gap: 6px; align-items: center; }
    #control-hint .key {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      background: var(--bg-btn);
      border: 1px solid var(--border-std);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    #control-hint .mouse-icon {
      width: 30px; height: 38px;
      border: 1px solid var(--border-std);
      border-radius: 8px;
      background: var(--bg-btn);
      display: flex; align-items: flex-start; justify-content: center;
      position: relative;
    }
    #control-hint .mouse-icon::after {
      content: '';
      display: block;
      width: 1.5px; height: 10px;
      background: var(--border-prom);
      margin-top: 7px;
      border-radius: 1px;
    }
    #control-hint .mouse-arrows {
      font-size: 16px;
      color: var(--text-muted);
    }
    /* ── Card selection screen ─────────────────────────── */
    #card-select {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: auto;
      background: rgba(10,10,12,0.88);
      backdrop-filter: blur(16px);
      gap: min(3vh, 16px); padding: 16px;
    }
    .card-header {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .card-header h2 {
      font-family: 'Source Code Pro', monospace;
      font-size: min(3vw, 14px); font-weight: 400;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--green);
    }
    .card-budget {
      font-size: min(5vw, 24px); font-weight: 500; color: var(--text-primary);
    }
    .card-row {
      display: flex; gap: min(3vw, 14px); justify-content: center;
      width: 90%; max-width: 560px;
    }
    .reward-card {
      flex: 1; min-width: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-std);
      border-radius: min(3vw, 14px);
      padding: min(3vw, 18px) min(2vw, 10px) min(2.5vw, 14px);
      display: flex; flex-direction: column; align-items: center;
      gap: min(1.5vw, 8px); cursor: pointer; transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .reward-card:hover { border-color: var(--border-prom); transform: translateY(-3px); }
    .reward-card.selected { border-color: var(--green); box-shadow: 0 0 20px rgba(62,207,142,0.3); transform: translateY(-4px) scale(1.03); }
    .reward-card.locked { opacity: 0.35; pointer-events: none; }
    .reward-card.purchased { opacity: 0.5; border-color: var(--green); }
    .reward-card.purchased::after {
      content: '✅'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); font-size: min(8vw, 36px);
    }
    .reward-card .card-rarity {
      font-family: 'Source Code Pro', monospace;
      font-size: min(2.2vw, 10px); font-weight: 400;
      letter-spacing: 0.8px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 4px;
    }
    .reward-card .card-rarity.common { background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .reward-card .card-rarity.rare { background: rgba(86,156,255,0.12); color: #569CFF; }
    .reward-card .card-rarity.epic { background: rgba(168,85,247,0.12); color: #A855F7; }
    .reward-card .card-icon { font-size: min(8vw, 38px); margin: min(1vw, 6px) 0; }
    .reward-card .card-name {
      font-size: min(3vw, 14px); font-weight: 500; color: var(--text-primary);
      text-align: center; line-height: 1.3;
    }
    .reward-card .card-desc {
      font-size: min(2.4vw, 11px); color: var(--text-muted);
      text-align: center; line-height: 1.3;
    }
    .reward-card .card-cost {
      font-size: min(3vw, 14px); font-weight: 500; color: var(--green);
      margin-top: min(0.5vw, 4px);
    }
    .reward-card .card-cost.too-expensive { color: #ef4444; }
    .card-bottom {
      display: flex; flex-direction: column; align-items: center; gap: min(1.5vh, 10px); margin-top: min(1vh, 6px);
    }
    .card-action-row {
      display: flex; align-items: center; gap: 10px;
    }
    .card-btn-ad {
      pointer-events: auto;
      background: var(--bg-btn); color: var(--text-primary);
      border: 1px solid var(--text-primary);
      padding: 9px 24px; font-size: min(3vw, 13px); font-weight: 500;
      border-radius: 9999px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }
    .card-btn-ad:hover { border-color: var(--green); color: var(--green); }
    .card-btn-reroll {
      pointer-events: auto;
      background: var(--bg-btn); color: var(--text-secondary);
      border: 1px solid var(--border-std);
      padding: 9px 20px; font-size: min(3vw, 13px); font-weight: 500;
      border-radius: 9999px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }
    .card-btn-reroll:hover { border-color: var(--text-muted); color: var(--text-primary); }
    .card-btn-skip {
      pointer-events: auto;
      background: transparent; color: var(--text-muted);
      border: none; padding: 6px 20px;
      font-size: min(2.8vw, 12px); font-weight: 400; cursor: pointer;
      transition: color 0.15s;
    }
    .card-btn-confirm { display: none; /* removed, double-tap to buy */ }
      transition: opacity 0.15s;
    }
    .card-btn-confirm:hover { opacity: 0.85; }
    .card-btn-skip:hover { color: var(--text-secondary); }

    /* ── Settings ───────────────────────────────────── */
    #settings-btn {
      position: absolute; top: 12px; left: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-std);
      color: var(--text-secondary);
      font-size: 18px;
      width: 38px; height: 38px;
      border-radius: 9999px;
      cursor: pointer; pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      transition: border-color 0.15s;
    }
    #settings-btn:hover { border-color: var(--border-prom); }
    #settings-panel {
      display: none;
      position: absolute; top: 58px; left: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-std);
      border-radius: 12px;
      padding: 16px 18px;
      min-width: 220px;
      backdrop-filter: blur(16px);
      pointer-events: auto;
      flex-direction: column; gap: 12px;
    }
    #settings-panel.open { display: flex; }
    .settings-title {
      font-family: 'Source Code Pro', monospace;
      font-size: 10px; font-weight: 400;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .settings-row {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-secondary); font-size: 13px;
    }
    .settings-row span:first-child { min-width: 40px; }
    .settings-row input[type="range"] {
      flex: 1; height: 4px;
      -webkit-appearance: none; appearance: none;
      background: var(--border-std); border-radius: 2px; outline: none;
    }
    .settings-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px;
      background: var(--text-primary); border-radius: 50%; cursor: pointer;
    }
    .snd-toggle {
      background: none; border: 1px solid var(--border-std);
      color: var(--green); font-size: 11px; font-weight: 500;
      padding: 3px 10px; border-radius: 6px; cursor: pointer;
      min-width: 36px;
    }
    .snd-toggle.off { color: var(--text-muted); border-color: var(--border-sub); }
    .settings-close-btn {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none;
      color: var(--text-muted); font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="ui">
    <!-- Top HUD -->
    <div id="top-hud">
      <div id="progress-row">
        <span id="progress-runner">🏃</span>
        <div id="progress-bar-wrap">
          <div id="progress-bar-fill"></div>
        </div>
        <span id="progress-flag">🏁</span>
      </div>
      <div id="level-label">LEVEL 1</div>
    </div>
    <div id="coin-display">0</div>
    <div id="count-display">1</div>

    <!-- Settings -->
    <button id="settings-btn">⚙️</button>
    <div id="settings-panel">
      <div class="settings-title">Settings</div>
      <div class="settings-row">
        <span>🎵 BGM</span>
        <input type="range" id="bgm-vol" min="0" max="100" value="50" />
        <button id="bgm-toggle" class="snd-toggle">ON</button>
      </div>
      <div class="settings-row">
        <span>🔊 SFX</span>
        <input type="range" id="sfx-vol" min="0" max="100" value="70" />
        <button id="sfx-toggle" class="snd-toggle">ON</button>
      </div>
      <button id="settings-close" class="settings-close-btn">✕</button>
    </div>

    <!-- Screens -->
    <div id="start-screen">
      <h1><span>Count </span><span>Control </span><span>Clone</span></h1>
      <p class="tap-hint">CLICK or SPACE to Start</p>
    </div>
    <div id="level-complete">
      <h2>LEVEL COMPLETED!</h2>
      <div class="score" id="complete-score"></div>
      <button id="continue-btn">CONTINUE</button>
    </div>
    <!-- Card Selection (레벨 클리어 후 카드 선택) -->
    <div id="card-select">
      <div class="card-header">
        <h2>CHOOSE YOUR REWARD</h2>
        <div class="card-budget">🪙 <span id="card-budget">0</span></div>
      </div>
      <div class="card-row" id="card-row"></div>
      <div class="card-bottom">
        <div class="card-action-row">
          <button class="card-btn-reroll" id="card-reroll-btn">🔄 Reroll (Free)</button>
          <button class="card-btn-ad" id="card-ad-btn"><span>🎬</span> +50 Gold</button>
        </div>
        <button class="card-btn-skip" id="card-skip-btn">Done →</button>
      </div>
    </div>

    <div id="game-over">
      <h2>GAME OVER</h2>
      <div class="go-stats">
        <div class="go-level" id="go-level">LEVEL 1</div>
        <div class="go-stat"><span class="go-icon">🪙</span><span class="go-val" id="go-coins">0</span></div>
        <div class="go-stat"><span class="go-icon">👥</span><span>Best Count:</span><span class="go-val" id="go-best">0</span></div>
      </div>
      <div class="go-buttons">
        <div class="ad-revive-info" id="ad-revive-info"></div>
        <button class="btn-ad" id="ad-retry-btn"><span class="ad-icon">🎬</span> Watch Ad to Continue</button>
        <button class="btn-restart" id="retry-btn">Restart from Level 1</button>
      </div>
    </div>
    <div id="control-hint">
      <div class="hint-title">MOVE</div>
      <div class="hint-row"><span class="key">A</span><span class="key">D</span></div>
      <div class="hint-row"><span class="key">&larr;</span><span class="key">&rarr;</span></div>
      <div class="hint-row"><div class="mouse-icon"></div><span class="mouse-arrows">&lsaquo; &rsaquo;</span></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
