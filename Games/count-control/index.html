<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Count Control</title>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js"}}
  </script>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101218;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    canvas{display:block}#ui{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}#level{font-weight:800;letter-spacing:.12em}
    #start,#gameover,#complete{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,18,.72);pointer-events:auto;text-align:center;padding:24px}
    #gameover,#complete{display:none}h1{font-size:clamp(38px,8vw,72px);margin:0 0 14px}p{margin:8px 0 22px;color:#cfd4e4}.button{border:0;border-radius:999px;background:#3ecf8e;color:#07120d;font-weight:900;padding:14px 28px;font-size:16px;cursor:pointer;pointer-events:auto}
  </style>
</head>
<body>
  <div id="ui"><div id="top"><div id="level">LEVEL 1</div></div>
    <div id="start"><h1>Count Control</h1><p>ゲートを選び、トルーパーを増やしてゴールを目指そう。</p><button class="button" id="startBtn">GAME START</button></div>
    <div id="complete"><h1>LEVEL CLEAR</h1><p id="score"></p><button class="button" id="nextBtn">NEXT LEVEL</button></div>
    <div id="gameover"><h1>GAME OVER</h1><button class="button" id="retryBtn">RETRY</button></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
