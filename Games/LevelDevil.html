<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Level Devil - Play Off!</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #101114; color: #fff; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { min-height: 52px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #191b20; }
    h1 { margin: 0; font-size: 17px; }
    a { color: #fff; }
    .launch { padding: 8px 13px; border-radius: 8px; background: #e83c3c; text-decoration: none; font-weight: 700; }
    main { flex: 1; min-height: 0; position: relative; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
    .note { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 6px 10px; border-radius: 6px; background: #101114cc; color: #ddd; font-size: 12px; text-align: center; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>Level Devil</h1>
    <a class="launch" href="https://leveldevil.net/" target="_blank" rel="noopener noreferrer">別タブでゲームを開く ↗</a>
  </header>
  <main>
    <iframe src="https://leveldevil.net/" title="Level Devil" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
    <div class="note">ゲームが表示されない場合は「別タブでゲームを開く」を押してください。</div>
  </main>
</body>
</html>
